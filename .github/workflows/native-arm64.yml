name: Native ARM64 Shapely 2.1.2 geometry
on:
  push:
    branches: [ci/native-arm64-2.1.2-geometry]
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-11-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: shapely/shapely
          ref: 5fb639d1056888d135fe56bfaf750c9648addeec
          path: source
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: arm64
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
      - name: Build and test native repaired wheel
        run: python ci/native/build_shapely.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shapely-2.1.2-cp312-win-arm64
          path: ${{ github.workspace }}/evidence
          if-no-files-found: error
          retention-days: 14
